<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password - ForecastArena</title>
    <link rel="stylesheet" href="change-password.css" />
  </head>
  <body>
    <div class="password-card">
      <h2>Change Password</h2>
      <p class="subtitle">Secure your ForecastArena account.</p>
      
      <div class="form-group">
        <label>Current Temporary Password:</label>
        <input type="password" id="old-pass" placeholder="••••••••" />

        <label>New Secure Password:</label>
        <input type="password" id="new-pass" minlength="6" placeholder="••••••••" />

        <button id="submit-change-pass">Update Password</button>
        
        <p class="footer-link">
          <a href="user-dashboard.html">Back to Dashboard</a>
        </p>
      </div>
    </div>
    <script src="change-password.js"></script>
  </body>
</html>
